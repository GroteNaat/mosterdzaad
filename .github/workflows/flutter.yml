name: Apps and PWA
on:
  push:
    branches: [main, codex/flutter-local-app]
    paths: ['app/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/flutter.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux}
          - {os: windows-latest, target: windows}
          - {os: macos-latest, target: apple}
          - {os: ubuntu-latest, target: android}
          - {os: ubuntu-22.04, target: web}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Configure build directories
        shell: bash
        run: |
          build_temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = "Windows" ]; then
            build_temp="$(cygpath -m "$RUNNER_TEMP")"
          fi
          echo "PUB_CACHE=$build_temp/mosterdzaad-pub" >> "$GITHUB_ENV"
          echo "SDK_DIR=$build_temp/mosterdzaad-flutter" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: flutter-cache
        with:
          path: ${{ env.SDK_DIR }}
          key: flutter-3.50.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          if [ ! -d "$SDK_DIR/.git" ]; then
            git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$SDK_DIR"
          fi
          echo "$SDK_DIR/bin" >> "$GITHUB_PATH"
          "$SDK_DIR/bin/flutter" --suppress-analytics --version
      - uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.target == 'android'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - name: Analyze and test
        if: matrix.target == 'linux'
        run: |
          dart format --output=none --set-exit-if-changed lib test
          dart --disable-dart-dev tool/check_vendor.dart
          flutter --suppress-analytics analyze --no-pub
          flutter --suppress-analytics test --no-pub
      - name: Native cryptographic interoperability
        if: matrix.target == 'windows' || matrix.target == 'apple'
        run: flutter --suppress-analytics test --no-pub test/sync_test.dart test/crdt_fixture_test.dart
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: native-sync-fixture
          path: app/build/native-fixture.json
          if-no-files-found: error
      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          flutter --suppress-analytics build linux --release
          mkdir -p build/packages
          tar -C build/linux/x64/release/bundle -czf build/packages/Mosterdzaad-linux-x64.tar.gz .
          bash packaging/linux/package-deb.sh
      - name: Build Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter --suppress-analytics build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($runtime in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path "build/windows/x64/runner/Release/$runtime")) { throw "Missing runtime: $runtime" }
          }
          New-Item -ItemType Directory -Force build/packages | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/packages/Mosterdzaad-windows-x64.zip
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { choco install innosetup -y --no-progress }
          & $compiler packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build macOS and iOS
        if: matrix.target == 'apple'
        run: |
          flutter --suppress-analytics build macos --release
          mkdir -p build/packages
          hdiutil create -volname Mosterdzaad -srcfolder build/macos/Build/Products/Release/mosterdzaad.app -ov -format UDZO build/packages/Mosterdzaad-macos.dmg
          flutter --suppress-analytics build ios --release --no-codesign
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/packages/Mosterdzaad-ios-UNSIGNED.zip
      - name: Build Android test APK
        if: matrix.target == 'android'
        run: |
          flutter --suppress-analytics build apk --debug
          mkdir -p build/packages
          cp build/app/outputs/flutter-apk/app-debug.apk build/packages/Mosterdzaad-android-test.apk
      - name: Test browser storage and build PWA
        if: matrix.target == 'web'
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: |
          flutter --suppress-analytics build web --release --no-web-resources-cdn
          dart --disable-dart-dev tool/prepare_pwa.dart
          npm install --prefix "$RUNNER_TEMP/pwa-test" --no-save --no-audit --no-fund playwright@1.62.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pwa-test/node_modules/playwright" node tool/test_pwa.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pwa-test/node_modules/playwright" node tool/test_sync_browser.cjs
          mkdir -p build/packages
          cd build/web
          zip -qr ../packages/Mosterdzaad-pwa.zip .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Mosterdzaad-${{ matrix.target }}
          path: app/build/packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.target == 'linux' || matrix.target == 'web')
        with:
          name: interface-previews-${{ matrix.target }}
          path: app/build/previews/*.png
          if-no-files-found: ignore
  interoperability:
    name: Native to browser interoperability
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mosterdzaad-flutter
          key: flutter-3.50.0-Linux-X64
      - name: Set up SDK
        run: |
          sdk_dir="$RUNNER_TEMP/mosterdzaad-flutter"
          if [ ! -d "$sdk_dir/.git" ]; then git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$sdk_dir"; fi
          echo "$sdk_dir/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$RUNNER_TEMP/mosterdzaad-pub" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: native-sync-fixture
          path: app/build/interop
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - name: Test native updates in WebAssembly
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/pwa-test" --no-save --no-audit --no-fund playwright@1.62.1
          NATIVE_FIXTURE="$PWD/build/interop/native-fixture.json" PLAYWRIGHT_MODULE="$RUNNER_TEMP/pwa-test/node_modules/playwright" node tool/test_sync_browser.cjs
