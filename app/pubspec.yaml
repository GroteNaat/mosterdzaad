name: mosterdzaad
description: Persoonlijke Bijbelstudie met een studieboek op je eigen apparaat.
publish_to: none
version: 0.2.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  material_ui: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  drift: ^2.35.4
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
  assets:
    - assets/data/books.json
    - assets/data/books-original.json
    - assets/data/DATA-SOURCES.md
    - assets/fonts/roboto_license.txt
