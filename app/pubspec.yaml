name: mosterdzaad
description: Persoonlijke Bijbelstudie met een studieboek op je eigen apparaat.
publish_to: none
version: 0.3.0+2
environment:
  sdk: '>=3.14.0 <4.0.0'
dependencies:
  material_ui: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  drift: ^2.35.4
  crypto: ^3.0.6
  http: ^1.6.0
  idb_shim: ^2.11.3
  web: ^1.1.1
  flutter_web_auth_2: 6.0.0-alpha.11
  loro_crdt: 0.1.0
  sodium: 4.1.2+1
  flutter_secure_storage: 11.2.0
  workmanager: 0.10.10
  connectivity_plus: 7.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
dependency_overrides:
  # Documented upstream opt-out: authentication always uses the system browser.
  flutter_web_auth_2_desktop_webview:
    path: packages/flutter_web_auth_2_desktop_webview
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
  assets:
    - assets/data/books.json
    - assets/data/books-original.json
    - assets/data/DATA-SOURCES.md
    - assets/fonts/roboto_license.txt
    - assets/licenses/loro-license.txt
    - assets/licenses/loro-third-party.txt
    - assets/licenses/libsodium-license.txt
